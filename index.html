  .card {
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 36px 32px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
    text-align: center;
  }
  .bee {
    font-size: 42px;
    margin-bottom: 6px;
  }
  h1 {
    color: #ffffff;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    font-size: 22px;
    margin: 0 0 4px;
  }
  p.sub {
    color: #fff0e6;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    font-size: 14px;
    margin: 0 0 24px;
  }
  label {
    display: block;
    text-align: left;
    color: #ffffff;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
    font-weight: 600;
    font-size: 14px;
    margin: 16px 0 6px;
  }
  textarea {
    width: 100%;
    background: rgba(255, 255, 255, 0.85);
    color: #3a2a1a;
    border: 2px solid rgba(255, 255, 255, 0.6);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    resize: vertical;
    min-height: 60px;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea::placeholder {
    color: #8a7a6a;
  }
  textarea:focus {
    border-color: #e8a33d;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #e8a33d;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  button:hover { background: #d68e28; }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.6; cursor: default; }
  .note {
    margin-top: 14px;
    font-size: 12px;
    color: #ffe9dd;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  .status {
    margin-top: 16px;
    font-size: 14px;
    font-weight: 600;
    min-height: 20px;
  }
  .status.success { color: #2f9e44; }
  .status.error { color: #e03131; }
</style>
</head>
<body>
  <div class="card">
    <div class="bee">🐝</div>
    <h1>Two Questions</h1>
    <p class="sub">Always and forever ❤️</p>

    <form id="qForm">
      <label for="q1">Question 1: What made you smile today?</label>
      <textarea id="q1" name="Question 1" required placeholder="Type your answer here..."></textarea>

      <label for="q2">Question 2: What's on your mind right now?</label>
      <textarea id="q2" name="Question 2" required placeholder="Type your answer here..."></textarea>

      <button type="submit" id="sendBtn">Send my answers 💗</button>
    </form>

    <div class="status" id="status"></div>
    <p class="note">I love you Bumblebee. My world is better with you in it❤️</p>
  </div>

<script>
  // ⚠️ SETUP REQUIRED (one-time, free):
  // 1. Go to https://formspree.io and sign up with oswardmlotha@gmail.com
  // 2. Create a new form — Formspree gives you an endpoint like:
  //    https://formspree.io/f/abcdwxyz
  // 3. Paste that endpoint below, replacing FORM_ENDPOINT_HERE
  // 4. The first submission sends a confirmation email to oswardmlotha@gmail.com —
  //    click "Confirm" in that email to activate the form. After that, every
  //    submission is sent automatically, no mail app popup, no confirmation needed.
  const FORM_ENDPOINT = "https://formspree.io/f/xyezpeqj";

  const form = document.getElementById('qForm');
  const status = document.getElementById('status');
  const btn = document.getElementById('sendBtn');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (FORM_ENDPOINT === "FORM_ENDPOINT_HERE") {
      status.textContent = "Setup needed: add your Formspree endpoint in the code first.";
      status.className = "status error";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Sending...";
    status.textContent = "";
    status.className = "status";

    const data = {
      "Question 1": document.getElementById('q1').value.trim(),
      "Question 2": document.getElementById('q2').value.trim(),
      "_subject": "Bumblebee's Answers 🐝"
    };

    try {
      const res = await fetch(FORM_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(data)
      });

      if (res.ok) {
        status.textContent = "Sent! 💗";
        status.className = "status success";
        form.reset();
      } else {
        status.textContent = "Something went wrong. Please try again.";
        status.className = "status error";
      }
    } catch (err) {
      status.textContent = "Network error. Please try again.";
      status.className = "status error";
    } finally {
      btn.disabled = false;
      btn.textContent = "Send my answers 💗";
    }
  });
</script>
</body>
</html>
